[project]
name = "club-concierge-backend"
version = "0.1.0"
description = "Club & Event Concierge — FastAPI backend, ingestion worker, and asyncpg data layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ai = [
    "langchain>=0.2",
    "langgraph>=0.1",
]
ingestion = [
    "apscheduler>=3.10",
    "apify-client>=1.7",
]
calendar = [
    "google-api-python-client>=2.137",
    "google-auth-oauthlib>=1.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
