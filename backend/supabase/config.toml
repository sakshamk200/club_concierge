# =============================================================================
# Club & Event Concierge — Supabase local configuration
# Generated to match `supabase init` output (CLI not installed in this env).
# Docs: https://supabase.com/docs/guides/local-development/cli/config
# =============================================================================

# A string used to distinguish different Supabase projects on the same host.
# Defaults to the working directory name when running `supabase init`.
project_id = "club-concierge"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# The database major version to use. Must match the version of your remote
# Supabase project (Supabase currently provisions PostgreSQL 15).
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
# Disabled for local dev: this project persists flyer images by URL only
# (events.original_image_url) and has no Supabase Storage buckets. Leaving the
# storage container out avoids an unhealthy-service rollback on `supabase start`.
enabled = false
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false
